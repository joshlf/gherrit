[package]
name = "gherrit"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.89.0"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
description = "Gerrit-style stacked diffs for GitHub"
repository = "https://github.com/joshlf/gherrit"
default-run = "gherrit"

[features]
# Builds the non-shipping process adapter used by integration tests. The
# production binary never reads test endpoints or dispatches the Git shim.
test-driver = []

[profile.release]
# Strip full debug info, but keep line tables for backtraces. This makes full
# GDB debugging difficult, but ensures that backtraces provide file/line and
# function names.
strip = "none"
debug = "line-tables-only"
debug-assertions = true
lto = true

[dependencies]
gix = { version = "0.75.0", features = ["blocking-network-client"] }
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.145"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5.53", features = ["derive"] }
eyre = "0.6"
color-eyre = "0.6"
owo-colors = "4.2"
# Octocrab's default retry and redirect middleware can replay mutation POSTs.
# Keep features explicit because GHerrit sends each mutation request at most
# once.
octocrab = { version = "0.48.1", default-features = false, features = [
    "default-client",
    "rustls",
    "rustls-ring",
    "timeout",
    "tracing",
] }
rand = "0.9.2"
tokio = { version = "1.48.0", features = ["full"] }
data-encoding = "2.6"
command-group = "5.0.1"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.1"
tempfile = "3.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
predicates = "3.1"
fastrand = "2.3"
testutil = { path = "testutil" }
insta = { version = "1.45", features = ["yaml"] }

[[bin]]
name = "gherrit"
path = "src/main.rs"

[[bin]]
name = "gherrit-test-driver"
path = "src/test_driver_main.rs"
required-features = ["test-driver"]

[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["test-driver"]

[[test]]
name = "hooks"
path = "tests/hooks.rs"
required-features = ["test-driver"]

[[test]]
name = "pre_push"
path = "tests/pre_push/main.rs"
required-features = ["test-driver"]

[workspace]
members = ["testutil"]
