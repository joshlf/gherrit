name: GHerrit – Automatic Stack Rebase Disabled
description: >-
  Compatibility entry point for installations which still invoke GHerrit's
  former automatic stack-rebase Action.
inputs:
  token:
    description: Historical compatibility input; no longer used.
    required: true
  pr_body:
    description: Historical compatibility input; no longer used.
    required: true

runs:
  using: composite
  steps:
    - name: Automatic stack rebasing is disabled
      shell: bash
      run: |
        set -eo pipefail
        echo "::notice title=GHerrit automatic rebase disabled::Rebase the" \
          "remaining stack locally and push it through GHerrit."
