name: GHerrit – Rebase Stack
description: 'Automatically rebase the next PR in a GHerrit stack.'
inputs:
  token:
    description: '`GITHUB_TOKEN` to allow rebase and push'
    required: true
  pr_body:
    description: 'The body/description of the PR that was just merged. Used to extract the child PR ID from the GHerrit metadata.'
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        MERGED_PR_BODY: ${{ inputs.pr_body }}
        MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
        MERGED_PR_HEAD: ${{ github.event.pull_request.head.ref }}
        MERGED_PR_BASE: ${{ github.event.pull_request.base.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        if [[ "$MERGED_PR_BASE" != "$DEFAULT_BRANCH" ]]; then
          echo "PR #$MERGED_PR_NUMBER targeted '$MERGED_PR_BASE', not the default branch '$DEFAULT_BRANCH'; refusing to cascade a non-root merge."
          exit 0
        fi

        CHILD_ID=$(
          printf '%s\n' "$MERGED_PR_BODY" |
            bash "$ACTION_PATH/ci/extract_stack_child.sh"
        )

        if [[ -z "$CHILD_ID" ]]; then
          echo "Merged PR has no child defined in metadata. Reached top of stack."
          exit 0
        fi

        echo "Merged PR indicates next child is ID: $CHILD_ID"

        CHILD_PRS=$(
          gh pr list \
            --head "$CHILD_ID" \
            --state open \
            --limit 100 \
            --json number,headRefName,baseRefName
        )
        CHILD_PR=$(
          printf '%s\n' "$CHILD_PRS" |
            bash "$ACTION_PATH/ci/select_cascade_child.sh" "$CHILD_ID" "$MERGED_PR_HEAD"
        )

        echo "Identified current child PR: #$CHILD_PR"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        gh pr checkout "$CHILD_PR"

        ACTUAL_ID=$(
          git log -1 --format=%B |
            git interpret-trailers --parse |
            sed -n 's/^gherrit-pr-id: //p'
        )
        if [[ "$ACTUAL_ID" != "$CHILD_ID" ]]; then
          echo "::error::Child PR #$CHILD_PR head carries GHerrit ID '$ACTUAL_ID', expected '$CHILD_ID'."
          exit 1
        fi

        gh pr edit "$CHILD_PR" --base "$DEFAULT_BRANCH"

        if ! git rebase "origin/$DEFAULT_BRANCH"; then
          echo "::error::Rebase conflict for PR #$CHILD_PR. Manual intervention required."
          exit 1
        fi

        git push --force-with-lease
