name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Rust Version
        id: rust-version
        # Parse Cargo.toml to get the rust-version. We use sed to avoid dependency
        # on the runner's cargo version (which might not support edition 2024).
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy

      - name: Cache intermediate build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Check Formatting
        run: |
          set -eo pipefail
          rustup component add --toolchain nightly rustfmt
          cargo +nightly fmt --all -- --check

      - name: Clippy
        run: |
          GHERRIT_TEST_BUILD=1 cargo clippy \
            --workspace --all-targets --locked -- -D warnings

      - name: Run Tests
        run: |
          GHERRIT_TEST_BUILD=1 cargo test \
            --workspace --all-targets --locked

      - name: Check task markers
        run: ci/check_todo.sh

      - name: Test stack metadata parser
        run: bash ci/test_extract_stack_child.sh

      - name: Archive bootstrap workspace
        run: |
          cargo build --locked
          rm -rf /tmp/gherrit-bootstrap
          mkdir -p /tmp/gherrit-bootstrap bootstrap
          cp target/debug/gherrit /tmp/gherrit-bootstrap/gherrit
          tar --exclude='./target' -czf /tmp/gherrit-bootstrap/workspace.tar.gz .
          cp /tmp/gherrit-bootstrap/* bootstrap/

      - name: Upload bootstrap workspace
        uses: actions/upload-artifact@v4
        with:
          name: gherrit-bootstrap
          path: bootstrap/

  windows-tests:
    name: Windows Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Rust Version
        id: rust-version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml `
            -Pattern '^rust-version\s*=\s*"([^"]+)"$'
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache intermediate build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Run tests
        env:
          GHERRIT_TEST_BUILD: "1"
        run: cargo test --workspace --all-targets --locked
