name: Agent diagnose review6 Clippy failure

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build
    paths:
      - .github/workflows/agent-diagnose-review6-clippy.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-gherrit-build
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reconstruct formatted candidate
        shell: bash
        run: |
          set -euxo pipefail
          base=20a97f10d68cc98793619363a601601ee2e48db2
          cat agent_payloads/review6/safe-pr-reorder-review6.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/review6.patch
          test "$(sha256sum /tmp/review6.patch | awk '{print $1}')" = \
            210bb5da1e28debee2ca7f4354dc71f2ad65a9d4e2e1499088cf6072e9fd021c
          git checkout --detach "$base"
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --committer-date-is-author-date /tmp/review6.patch
          test "$(git rev-parse HEAD)" = 249dc06cccdeae88a12961ef6e12c2a717a462ad

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" \
            >> "$GITHUB_OUTPUT"

      - name: Install project Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Apply exact nightly formatting
        shell: bash
        run: |
          set -euxo pipefail
          cargo +nightly fmt --all
          git diff --binary > /tmp/review6-nightly-rustfmt.patch
          test "$(sha256sum /tmp/review6-nightly-rustfmt.patch | awk '{print $1}')" = \
            c1bc7a18c1acfc149c6edeff234a1d1d2ad00cd693759814414c5e9862d227e2
          cargo +nightly fmt --all -- --check

      - name: Capture Clippy diagnostics
        id: clippy
        shell: bash
        env:
          GHERRIT_TEST_BUILD: "1"
        run: |
          set +e
          cargo +${{ steps.rust-version.outputs.version }} clippy \
            --workspace --all-targets --locked -- -D warnings \
            > /tmp/clippy.log 2>&1
          status=$?
          set -e
          cat /tmp/clippy.log
          printf '%s\n' "$status" > /tmp/clippy.status
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: review6-clippy-diagnostics
          path: |
            /tmp/clippy.log
            /tmp/clippy.status
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure status
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: exit 1
