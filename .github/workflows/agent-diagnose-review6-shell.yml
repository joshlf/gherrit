name: Agent diagnose review6 shell-suite failure

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build
    paths:
      - .github/workflows/agent-diagnose-review6-shell.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-gherrit-build
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reconstruct semantic candidate
        shell: bash
        run: |
          set -euxo pipefail
          base=20a97f10d68cc98793619363a601601ee2e48db2
          cat agent_payloads/review6/safe-pr-reorder-review6.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/review6.patch
          test "$(sha256sum /tmp/review6.patch | awk '{print $1}')" = \
            210bb5da1e28debee2ca7f4354dc71f2ad65a9d4e2e1499088cf6072e9fd021c
          git checkout --detach "$base"
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --committer-date-is-author-date /tmp/review6.patch
          test "$(git rev-parse HEAD)" = 249dc06cccdeae88a12961ef6e12c2a717a462ad

      - name: Run shell suites independently
        id: suites
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/review6-shell-logs
          overall=0
          run_one() {
            name=$1
            shift
            printf 'COMMAND:' > "/tmp/review6-shell-logs/$name.log"
            printf ' %q' "$@" >> "/tmp/review6-shell-logs/$name.log"
            printf '\n' >> "/tmp/review6-shell-logs/$name.log"
            timeout --kill-after=10s 600s "$@" \
              >> "/tmp/review6-shell-logs/$name.log" 2>&1
            status=$?
            printf '\nSTATUS=%s\n' "$status" >> "/tmp/review6-shell-logs/$name.log"
            printf '%s\t%s\n' "$name" "$status" | tee -a /tmp/review6-shell-logs/statuses.tsv
            if [ "$status" -ne 0 ]; then overall=1; fi
          }
          run_one check-todo bash ci/check_todo.sh
          run_one extract-stack-child bash ci/test_extract_stack_child.sh
          run_one select-cascade-child bash ci/test_select_cascade_child.sh
          run_one cascade-action bash ci/test_cascade_action.sh
          run_one cascade-syntax bash -n ci/cascade_stack.sh
          run_one selector-syntax bash -n ci/select_cascade_child.sh
          run_one cascade-test-syntax bash -n ci/test_cascade_action.sh
          run_one python-compile python3 -m py_compile ci/gherrit_protocol.py
          for log in /tmp/review6-shell-logs/*.log; do
            echo "===== $log ====="
            cat "$log"
          done
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: review6-shell-diagnostics
          path: /tmp/review6-shell-logs
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure status
        if: steps.suites.outputs.overall != '0'
        shell: bash
        run: exit 1
