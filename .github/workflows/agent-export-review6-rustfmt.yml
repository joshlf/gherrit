name: Agent export review6 nightly-rustfmt delta

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build
    paths:
      - .github/workflows/agent-export-review6-rustfmt.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-gherrit-build
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reconstruct candidate
        shell: bash
        run: |
          set -euxo pipefail
          base=20a97f10d68cc98793619363a601601ee2e48db2
          cat agent_payloads/review6/safe-pr-reorder-review6.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/review6.patch
          test "$(sha256sum /tmp/review6.patch | awk '{print $1}')" = \
            210bb5da1e28debee2ca7f4354dc71f2ad65a9d4e2e1499088cf6072e9fd021c
          git checkout --detach "$base"
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --committer-date-is-author-date /tmp/review6.patch
          test "$(git rev-parse HEAD)" = 249dc06cccdeae88a12961ef6e12c2a717a462ad

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Export exact formatting delta
        shell: bash
        run: |
          set -euxo pipefail
          cargo +nightly fmt --all
          git diff --binary > /tmp/review6-nightly-rustfmt.patch
          test -s /tmp/review6-nightly-rustfmt.patch
          git diff --check
          sha256sum /tmp/review6-nightly-rustfmt.patch > /tmp/SHA256SUMS
          git diff --stat

      - name: Upload formatting delta
        uses: actions/upload-artifact@v4
        with:
          name: review6-nightly-rustfmt
          path: |
            /tmp/review6-nightly-rustfmt.patch
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
