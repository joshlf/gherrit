name: Agent publish safe-pr-reorder review7 fixes

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build
    paths:
      - .github/workflows/agent-publish-review7-fixes.yml
      - agent_payloads/review7/**

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-gherrit-build
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct exact validated candidate
        shell: bash
        run: |
          set -euxo pipefail
          base=fa30bb4a86cbb1dbab74e91fa9ba08a422424ec7
          payload=agent_payloads/review7/safe-pr-reorder-review7.patch.gz.b64

          cat > /tmp/review7-chunk-hashes <<'HASHES'
          533c4ea3371d488fa1c4a200211c1aa07e4a3c6f3318c1589d3a61b60d390fd2  000
          1547b76da8517a3d2328a71c6fb22fafb32cb4b2a457523857e7b3761e6e1157  001
          9e99245e040c2622b07db602e095dc68a149c80b0930deb69e8f550640aee449  002
          c2ecf2a09d0593c50dc856d25af3c55d487d7d89286a26660926900c300fb27d  003
          eb32603478b0c6efa8e40540c64b17b616b12ace478209b6f9d9f62f224b546f  004
          61e241bdd013a28f2b33053cd6c4fb191bad7d95b3075950703c6601fbb9991c  005
          c9b77f63b5167fc42b4c3de6e0b5d96e4a3ba6af6ff5283dd3e60cdf614e2ee8  006
          2e4bde6383d941c04b4586a12c7cd2a225184cdd62b1ad703a8234ed94d09ae6  007
          58430e011117660314e18b9230298155f1141661807a4369133edebe6a72dde4  008
          HASHES
          while read -r expected suffix; do
            file="$payload.$suffix"
            test -f "$file"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"
          done < /tmp/review7-chunk-hashes

          cat "$payload".??? > /tmp/review7.patch.gz.b64
          test "$(wc -c < /tmp/review7.patch.gz.b64)" = 13392
          test "$(sha256sum /tmp/review7.patch.gz.b64 | awk '{print $1}')" = \
            2cf870450b7cc356c78a0c281212a30f5455e7eff8145a725b3a5f160cc5bf31
          base64 --decode /tmp/review7.patch.gz.b64 > /tmp/review7.patch.gz
          test "$(sha256sum /tmp/review7.patch.gz | awk '{print $1}')" = \
            fb35852ab9bcddec2de8120024a06f11fb1375aa8064a565104213aed5b5ee6e
          gzip --decompress --stdout /tmp/review7.patch.gz > /tmp/review7.patch
          test "$(sha256sum /tmp/review7.patch | awk '{print $1}')" = \
            d6a0a1a2a2001421a56e76f7cabcc10b97ce2830a9a6ffcb97e5ff7a67b9fd18

          git fetch --force origin \
            refs/heads/agent/safe-pr-reorder:refs/remotes/origin/agent/safe-pr-reorder
          test "$(git rev-parse refs/remotes/origin/agent/safe-pr-reorder)" = "$base"

          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$base"
          git am --committer-date-is-author-date /tmp/review7.patch

          test "$(git rev-parse HEAD~1)" = 31e16491927867be1450f72d5d3891cc9e8a119e
          test "$(git rev-parse HEAD)" = 35f6e55d6fbc325756a902357f1a9aed2e545745
          test "$(git rev-parse HEAD^{tree})" = 59e7236449167b5b51a2e54a14fd06d5e5b9450f
          test "$(git rev-list --count "$base"..HEAD)" = 2
          test "$(git show --no-patch --format=%s HEAD~1)" = \
            "Harden publication endpoint resolution"
          test "$(git show --no-patch --format=%s HEAD)" = \
            "Preflight GitHub pull-request titles"
          test "$(git log -1 --format=%B HEAD~1 | grep -Ec '^gherrit-pr-id: Gbedy6ab4hfciypecnfuiorthhm4uyidn$')" = 1
          test "$(git log -1 --format=%B HEAD | grep -Ec '^gherrit-pr-id: Gmtdxst2u4a7vjxawl37cb2kzlgjvww4d$')" = 1
          git diff --check "$base"...HEAD
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git log --reverse --format='%H %s' "$base"..HEAD

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" \
            >> "$GITHUB_OUTPUT"

      - name: Install project Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting and patch integrity
        shell: bash
        run: |
          set -euxo pipefail
          cargo +nightly fmt --all -- --check
          git diff --check fa30bb4a86cbb1dbab74e91fa9ba08a422424ec7...HEAD
          test -z "$(git status --porcelain)"

      - name: Run Clippy
        env:
          GHERRIT_TEST_BUILD: "1"
        run: >-
          cargo +${{ steps.rust-version.outputs.version }} clippy
          --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        env:
          GHERRIT_TEST_BUILD: "1"
        run: >-
          cargo +${{ steps.rust-version.outputs.version }} test
          --workspace --all-targets --locked

      - name: Run protocol and cascade validation
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/review7-pycache
        run: |
          set -euxo pipefail
          ci/check_todo.sh
          bash ci/test_extract_stack_child.sh
          bash ci/test_select_cascade_child.sh
          bash ci/test_cascade_action.sh
          bash -n ci/cascade_stack.sh
          bash -n ci/select_cascade_child.sh
          bash -n ci/test_cascade_action.sh
          python3 -m py_compile ci/gherrit_protocol.py
          test -z "$(git status --porcelain)"

      - name: Publish exact validated history
        shell: bash
        run: |
          set -euxo pipefail
          base=fa30bb4a86cbb1dbab74e91fa9ba08a422424ec7
          test -n "$FINAL_HEAD"
          test -n "$FINAL_TREE"
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"
          test "$(git rev-list --count "$base"..HEAD)" = 2
          git push --no-verify \
            --force-with-lease=refs/heads/agent/safe-pr-reorder:$base \
            origin HEAD:refs/heads/agent/safe-pr-reorder
          observed=$(git ls-remote origin refs/heads/agent/safe-pr-reorder | awk '{print $1}')
          test "$observed" = "$FINAL_HEAD"
          printf 'Published %s with tree %s\n' "$FINAL_HEAD" "$FINAL_TREE"
