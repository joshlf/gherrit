name: Agent export safe-pr-reorder review7 source

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build
    paths:
      - .github/workflows/agent-export-review7-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          ref: agent/safe-pr-reorder
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify and package reviewed source
        shell: bash
        run: |
          set -euxo pipefail
          expected=fa30bb4a86cbb1dbab74e91fa9ba08a422424ec7
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse refs/heads/agent/safe-pr-reorder)" = "$expected"
          git bundle create /tmp/safe-pr-reorder-review7.bundle \
            refs/heads/agent/safe-pr-reorder
          git bundle verify /tmp/safe-pr-reorder-review7.bundle
          tar --exclude=.git --exclude=target -czf \
            /tmp/safe-pr-reorder-review7-source.tar.gz .
          sha256sum \
            /tmp/safe-pr-reorder-review7.bundle \
            /tmp/safe-pr-reorder-review7-source.tar.gz \
            > /tmp/SHA256SUMS

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: safe-pr-reorder-review7-source
          path: |
            /tmp/safe-pr-reorder-review7.bundle
            /tmp/safe-pr-reorder-review7-source.tar.gz
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
