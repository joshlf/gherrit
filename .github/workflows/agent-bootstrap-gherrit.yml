name: Agent publish GHerrit stack

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation source branch
        uses: actions/checkout@v4
        with:
          ref: agent/safe-pr-reorder-source
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install modified GHerrit
        run: cargo install --path . --locked

      - name: Configure repository and install GHerrit hooks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gherrit install
          gherrit manage --private

      - name: Publish with GHerrit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push

      - name: Clean temporary source and bootstrap branches
        if: success()
        run: |
          git push origin --delete agent/safe-pr-reorder-source || true
          git push origin --delete agent/bootstrap-gherrit-build || true
