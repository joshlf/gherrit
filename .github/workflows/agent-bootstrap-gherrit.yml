name: Agent bootstrap GHerrit

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Package nightly toolchain
        run: tar -C "$HOME/.rustup/toolchains" -czf nightly-rustfmt.tar.gz nightly-x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-rustfmt
          path: nightly-rustfmt.tar.gz
          if-no-files-found: error
          retention-days: 1
