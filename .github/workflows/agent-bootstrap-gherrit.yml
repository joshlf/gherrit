name: Agent publish safe-pr-reorder fourth-review fixes

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-gherrit-build
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify, apply, and publish
        run: |
          set -euxo pipefail

          cat agent_payloads/review3/safe-pr-reorder-review3.patch.gz.b64.* \
            > /tmp/review3.patch.gz.b64
          test "$(sha256sum /tmp/review3.patch.gz.b64 | awk '{print $1}')" = \
            50d14daf2ca0328733e32d4c3a9d924466db5cb95c8996c6e066f657a3e05388
          base64 --decode /tmp/review3.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/review3.patch
          test "$(sha256sum /tmp/review3.patch | awk '{print $1}')" = \
            79f2684f87c75bd4ac0e58d9fa961767eb7563eebf3639945ce409cfd8e4da7f

          git fetch --force origin \
            refs/heads/agent/safe-pr-reorder:refs/remotes/origin/agent/safe-pr-reorder
          test "$(git rev-parse refs/remotes/origin/agent/safe-pr-reorder)" = \
            42e1ff1e5a99f8d7a4a966ca60b9245cbc1609a6

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach 42e1ff1e5a99f8d7a4a966ca60b9245cbc1609a6
          git am /tmp/review3.patch

          test "$(git rev-list --count 42e1ff1e5a99f8d7a4a966ca60b9245cbc1609a6..HEAD)" = 2
          test "$(git rev-parse HEAD^{tree})" = 4e163518479a1b4ea06088279517ab1a7fdbb1f9
          test "$(git show --no-patch --format=%s HEAD~1)" = \
            "Protect and recover cascade transitions"
          test "$(git show --no-patch --format=%s HEAD)" = \
            "Check grafts in the common Git directory"
          git diff --check 42e1ff1e5a99f8d7a4a966ca60b9245cbc1609a6...HEAD

          git push \
            --force-with-lease=refs/heads/agent/safe-pr-reorder:42e1ff1e5a99f8d7a4a966ca60b9245cbc1609a6 \
            origin HEAD:refs/heads/agent/safe-pr-reorder
