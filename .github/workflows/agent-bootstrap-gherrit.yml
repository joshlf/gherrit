name: Agent bootstrap GHerrit

on:
  push:
    branches:
      - agent/bootstrap-gherrit-build

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build GHerrit
        run: cargo build --locked

      - name: Package checkout and tools
        run: |
          git bundle create gherrit.bundle --all
          cp target/debug/gherrit gherrit-linux-amd64
          cp "$(command -v gh)" gh-linux-amd64
          tar -C "$HOME" -czf rust-dev-env.tar.gz .rustup .cargo

      - uses: actions/upload-artifact@v4
        with:
          name: gherrit-bootstrap
          path: |
            gherrit.bundle
            gherrit-linux-amd64
            gh-linux-amd64
            rust-dev-env.tar.gz
          if-no-files-found: error
          retention-days: 1
